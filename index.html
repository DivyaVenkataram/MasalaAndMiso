<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masala & Miso</title>
  <style>
    body {
      font-family: Georgia, serif;
      background: #0a0a0a;
      color: #d1d1d6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    .box {
      max-width: 420px;
    }
    h1 { font-size: 1.5rem; letter-spacing: 0.12em; color: #fff; margin-bottom: 1rem; }
    p { margin-bottom: 1.5rem; line-height: 1.6; opacity: 0.9; }
    a {
      display: inline-block;
      color: #114665;
      border: 1px solid #114665;
      padding: 0.75rem 1.5rem;
      text-decoration: none;
      margin-top: 0.5rem;
    }
    a:hover { background: #114665; color: #fff; }
    code { background: rgba(255,255,255,0.1); padding: 0.2em 0.5em; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="box">
    <h1>MASALA & MISO</h1>
    <p>This file is not the main site. The full editorial site runs as a Next.js app.</p>
    <p>In the project folder, run in a terminal:</p>
    <p><code>npm install</code><br>then<br><code>npm run dev</code></p>
    <p>Then open <strong><a href="http://localhost:3000">http://localhost:3000</a></strong> in your browser.</p>
    <p>If you see “port in use”, try <a href="http://localhost:3001">http://localhost:3001</a>.</p>
    <a href="http://localhost:3000">Open app →</a>
  </div>
</body>
</html>
